<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--BEGIN SINGLE PWA-->
		<!-- 1 meta viewport DUY NHẤT: gộp PWA + interactive-widget (Chrome 108+ — keyboard
		     co layout nên dvh phản hồi). BỎ shrink-to-fit=no + maximum-scale=1 (cái cũ
		     chặn zoom — vi phạm accessibility WCAG 1.4.4 + iOS tự zoom khi focus input
		     font <16px, và meta viewport sau GHI ĐÈ meta trước nên chặn zoom toàn cục). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- PWA manifest + theme_color (primary-500 light mode — token tĩnh duy nhất
		     sống ngoài CSS; sw.js chỉ precache offline fallback, không đụng API encrypted). -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#3180ff" />
		<link rel="icon" href="/icons/icon-192.png" type="image/png" />
		<!--END SINGLE PWA-->
		<!-- Service worker: đăng ký sau load — không chặn first paint -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.register('/sw.js').catch(function () {
						/* offline-only feature — lỗi đăng ký không ảnh hưởng app */
					});
				});
			}
		</script>
		<!-- Batch 13 (m10824-3): cảm giác native-app trên iOS — chặn pinch-zoom 2 ngón
		     (gesturestart; meta user-scalable=no bị iOS ≥10 bỏ qua) + pull-to-refresh
		     (overscroll-behavior chỉ iOS 16+; iOS ≤15 chặn touchmove khi document ở
		     đỉnh VÀ target không cuộn được nội bộ — guard closest('[data-overscroll]')). -->
		<script>
			document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
			document.addEventListener('touchmove', function (e) {
				if (e.touches.length !== 1) return;
				if (e.target.closest && e.target.closest('[data-overscroll]')) return;
				if (document.documentElement.scrollTop <= 0 &&
				    (document.scrollingElement || document.documentElement).scrollTop <= 0 &&
				    (window.scrollY || 0) <= 0 && document.body && document.body.scrollTop <= 0) {
					// Root Container là scroll host thật (body/window luôn 0) — chỉ chặn khi
					// target ở vùng cuộn gốc, không đụng các vùng [data-overscroll] nội bộ.
					var el = e.target;
					while (el && el !== document.body) {
						var ov = getComputedStyle(el).overflowY;
						if (ov === 'auto' || ov === 'scroll') return;
						el = el.parentElement;
					}
					e.preventDefault();
				}
			}, { passive: false });
		</script>

		%unocss-svelte-scoped.global%
		<!--------------------- -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
